<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DiceTale 地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DiceTale 地图</h1>
    <span id="connectionStatus" class="status disconnected">未连接</span>
  </header>

  <main>
    <section class="panel map-panel">
      <div id="mapTabs" class="map-tabs"></div>
      <div id="mapContainer" class="map-container">
        <img id="mapImage" alt="地图" draggable="false">
        <div id="doorLayer" class="door-layer"></div>
      </div>
      <div class="legend">
        <span class="legend-item"><i class="marker-dot locked"></i>锁定</span>
        <span class="legend-item"><i class="marker-dot unlocked"></i>已开启</span>
        <span class="legend-item">⦿ 传送门</span>
        <span class="legend-item">▣ 普通门</span>
        <span class="legend-item"><i class="marker-dot player"></i>玩家</span>
      </div>
    </section>

    <details class="panel" open>
      <summary>玩家列表</summary>
      <div id="playerList" class="player-list"></div>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
