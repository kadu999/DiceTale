<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DiceTale 地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DiceTale 地图</h1>
    <span id="connectionStatus" class="status disconnected">未连接</span>
  </header>

  <main class="layout">
    <section class="panel map-panel">
      <div id="mapTabs" class="map-tabs"></div>
      <div id="mapContainer" class="map-container">
        <img id="mapImage" alt="地图" draggable="false">
        <div id="doorLayer" class="door-layer"></div>
      </div>
      <div class="legend">
        <span class="legend-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V10a8 8 0 0 1 16 0v11"/><circle cx="12" cy="10" r="3.2" fill="#334155" stroke="none" opacity="0.75"/></svg>
          传送门
        </span>
        <span class="legend-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="7" y1="7" x2="7" y2="17"/><circle cx="14.5" cy="12" r="1.4" fill="#334155" stroke="none"/></svg>
          普通门
        </span>
        <span class="legend-item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#334155"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 21c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>
          玩家
        </span>
      </div>
    </section>

    <details class="panel player-panel" open>
      <summary>玩家列表</summary>
      <div id="playerList" class="player-list"></div>
    </details>
  </main>

  <!-- 手机竖屏时的横屏引导 -->
  <div id="rotateHint" class="rotate-hint">
    <div class="rotate-icon">🔄</div>
    <p>请将手机横屏<br>以显示地图</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
