<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DiceTale 后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DiceTale 后台</h1>
    <nav class="page-tabs">
      <button id="pageBtnMap" class="page-tab active" onclick="switchPage('map')">地图</button>
      <button id="pageBtnPlayers" class="page-tab" onclick="switchPage('players')">玩家</button>
    </nav>
    <div class="status-group">
      <span id="clientStatus" class="status disconnected">客户端未连接</span>
      <span id="connectionStatus" class="status disconnected">未连接</span>
    </div>
  </header>

  <main class="layout">
    <!-- 地图页：地图查看 + 目标属性 -->
    <section id="pageMap" class="page active">
      <section class="panel map-panel">
        <div id="mapTabs" class="map-tabs"></div>
        <div id="mapContainer" class="map-container">
          <img id="mapImage" alt="地图" draggable="false">
          <div id="overlayLayer" class="overlay-layer"></div>
        </div>
      </section>

      <details class="panel property-panel" open>
        <summary>属性</summary>
        <div id="propertyListMap" class="property-list"></div>
      </details>
    </section>

    <!-- 玩家页：每个玩家一个属性卡片 -->
    <section id="pagePlayers" class="page">
      <details class="panel player-panel" open>
        <summary>玩家</summary>
        <div id="playerList" class="player-list"></div>
      </details>
    </section>
  </main>

  <!-- 手机竖屏时的横屏引导 -->
  <div id="rotateHint" class="rotate-hint">
    <div class="rotate-icon">🔄</div>
    <p>请将手机横屏<br>以显示地图</p>
  </div>

  <!-- 操作失败提示（如客户端未连接、超出库存） -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
