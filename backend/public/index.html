<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DiceTale 后台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DiceTale 后台</h1>
    <nav class="page-tabs">
      <button id="pageBtnMap" class="page-tab active" onclick="switchPage('map')">地图</button>
      <button id="pageBtnPlayers" class="page-tab" onclick="switchPage('players')">玩家</button>
      <button id="pageBtnItems" class="page-tab" onclick="switchPage('items')">道具</button>
    </nav>
    <div class="status-group">
      <span id="clientStatus" class="status disconnected">客户端未连接</span>
      <span id="connectionStatus" class="status disconnected">未连接</span>
    </div>
  </header>

  <main class="layout">
    <!-- 地图页：地图查看 + 目标属性 -->
    <section id="pageMap" class="page active">
      <div class="map-grid">
        <section class="panel map-selector">
          <div class="property-title">地图</div>
          <div id="mapTabs" class="map-tabs"></div>
        </section>
        <div class="map-cell">
          <div id="mapContainer" class="map-container">
            <img id="mapImage" alt="地图" draggable="false">
            <div id="overlayLayer" class="overlay-layer"></div>
          </div>
        </div>
        <section class="panel property-panel">
          <div class="property-title">属性</div>
          <div id="propertyListMap" class="property-list"></div>
        </section>
      </div>
    </section>

    <!-- 玩家页：每个玩家一个属性面板（与地图页属性面板同款），从左到右排列 -->
    <section id="pagePlayers" class="page">
      <div id="playerList" class="player-list"></div>
    </section>

    <!-- 道具页：道具目录（左侧列表 + 搜索）+ 道具详情（中间）+ 玩家分配（右侧 220px，与地图页属性面板同宽） -->
    <section id="pageItems" class="page">
      <div class="item-grid">
        <section class="panel item-selector">
          <div class="property-title">道具</div>
          <input id="itemSearch" class="item-search" type="search" placeholder="搜索道具名 / 类别" autocomplete="off">
          <div id="itemCategory" class="item-category-tags"></div>
          <div id="itemList" class="item-list"></div>
        </section>
        <section class="panel item-detail">
          <div class="property-title" id="itemDetailTitle">选择道具</div>
          <div id="itemDetail" class="property-list"></div>
        </section>
        <section class="panel item-property">
          <div class="property-title" id="itemAssignTitle">分配</div>
          <div id="itemAssign" class="property-list"></div>
        </section>
      </div>
    </section>
  </main>

  <!-- 手机竖屏时的横屏引导 -->
  <div id="rotateHint" class="rotate-hint">
    <div class="rotate-icon">🔄</div>
    <p>请将手机横屏<br>以显示地图</p>
  </div>

  <!-- 操作失败提示（如客户端未连接、超出库存） -->
  <div id="toast" class="toast"></div>

  <!-- 道具选择弹框：点击道具查看属性，点「确定」添加到目标背包 -->
  <div id="itemPickerModal" class="modal-mask" style="display:none" onclick="if (event.target === this) closeItemPicker()">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">选择道具</span>
        <button class="modal-close" onclick="closeItemPicker()">×</button>
      </div>
      <input id="pickerSearch" class="item-search" type="search" placeholder="搜索道具名 / 类别" autocomplete="off">
      <div id="pickerCategory" class="item-category-tags"></div>
      <div class="modal-body">
        <div class="modal-list-col">
          <div class="modal-hint">点击道具查看属性</div>
          <div id="pickerList" class="item-list modal-item-list"></div>
        </div>
        <div class="modal-detail-col">
          <div class="property-title" id="pickerDetailTitle">道具属性</div>
          <div id="pickerDetail" class="property-list modal-detail-list"></div>
          <div id="pickerQtyRow" class="property-row modal-detail-qty" style="display:none">
            <span class="property-label">数量</span>
            <input id="pickerQty" class="property-item-qty" type="number" min="1" max="99" value="1">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="state-btn" onclick="closeItemPicker()">取消</button>
        <button class="state-btn picker-confirm" id="pickerConfirm" onclick="confirmPickerAdd()">确定</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
