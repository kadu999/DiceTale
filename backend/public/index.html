<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DiceTale 地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DiceTale 地图</h1>
    <span id="connectionStatus" class="status disconnected">未连接</span>
  </header>

  <main class="layout">
    <section class="panel map-panel">
      <div id="mapTabs" class="map-tabs"></div>
      <div id="mapContainer" class="map-container">
        <img id="mapImage" alt="地图" draggable="false">
        <div id="overlayLayer" class="overlay-layer"></div>
      </div>
      <div class="legend">
        <span class="legend-item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="#334155"><circle cx="12" cy="7.5" r="3.5"/><path d="M4.5 21c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>
          玩家
        </span>
        <span class="legend-item"><span class="legend-pill">目标</span></span>
        <span class="legend-item"><span class="legend-pill door">门</span></span>
        <span class="legend-item">点击目标查看 / 修改属性</span>
      </div>
    </section>

    <details class="panel property-panel" open>
      <summary>属性</summary>
      <div id="propertyList" class="property-list"></div>
    </details>

    <details class="panel object-panel">
      <summary>后台对象</summary>
      <div id="objectList" class="object-list"></div>
    </details>
  </main>

  <!-- 手机竖屏时的横屏引导 -->
  <div id="rotateHint" class="rotate-hint">
    <div class="rotate-icon">🔄</div>
    <p>请将手机横屏<br>以显示地图</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
